name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
# The ref has to be in the group key — without it every branch and PR shares one
# group, so a push to any branch cancels the CI of every other open PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run tests
        run: 'npm test'

      # The workflow prompt hands an agent literal node types, operation values
      # and parameter names. A stale one produces workflow JSON that pastes as a
      # broken node, and nothing else in CI would notice. Runs after build
      # because it reads the compiled node description.
      - name: Check workflow prompt is current
        run: 'npm run prompt:check'
