name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
# The ref has to be in the group key — without it every branch and PR shares one
# group, so a push to any branch cancels the CI of every other open PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to match publish.yml: a release is gated on this workflow, so
          # the Node it passes on has to be the Node that publishes it. 'lts/*'
          # drifts (Node 26 from Oct 2026) and would let CI go green on a
          # runtime the publish job never uses.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run tests
        run: 'npm test'

      # The pre-push review gate, checked here but deliberately not in
      # publish.yml: a broken developer hook must not be able to block a
      # release of the node itself.
      - name: Run review-gate tests
        run: 'npm run test:hooks'
